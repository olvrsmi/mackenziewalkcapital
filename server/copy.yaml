# =============================================================================
# Office 4B, 6 Mackenzie Walk — every word the player reads.
#
# Edit this file freely. The bot reloads it on save; nothing needs restarting
# and nobody's position is lost. If something here is wrong the message says so
# rather than the round ending, and the console names the key.
#
# Values in {braces} are supplied by the engine, already formatted — {balance}
# is "1,000G", {coherence} is "0.999". Each message below lists what it can use.
#
# When prose needs to bend there are escape hatches:
#   {n} opportunit{n|s:y:ies}          singular or plural
#   {#if recovering} (…){/if}          only when true
#   {#if x}this{:else}that{/if}        one or the other
#   {balance_raw|money}                re-format a raw number yourself
#
# Anywhere a list is given, one line is chosen at random.
# Run `npm run copy-check` to confirm nothing is missing or misspelt.
# =============================================================================

scenes:

  # {round} {coherence} {recovery} {recovering} {balance} {subscribed} {daily}
  round: |
    **Round {round}**

    Day {day} · {day_left} left
    Your coherence: {coherence}{#if recovering} (recovery in {recovery}){/if}
    Today's budget: {budget} · balance {balance} ({pl})
    {#if has_bonus}Personal pot: {bonus}{/if}

  # no values
  offer: Three worlds are open to you.

  # {world} {opportunities} {complexity} {monopoly} {volatility} {disconnected}
  entered: |
    **{world}**
    {opportunities} investment {opportunities|s:opportunity:opportunities} · {complexity}
    {monopoly}% corporate monopolisation
    {volatility}% expected volatility{#if disconnected}
    _Holdings here do not all connect._{/if}

  # {world} {progress} {total} {coherence} {balance} {last_chance}
  investment: |
    **{world}** — {moment} (estimated length: {total})

    Your coherence: {coherence}
    Your balance: {balance}{#if last_chance}

    _Last chance to act._{/if}

  # {world} {holding} {value} {change} {arrow} {pl}
  readout: "**{world}** · {holding} @ {value} · {change} {arrow} · P/L {pl}"

  # {stake} {holding}
  staking: "{stake} on **{holding}**. Making investment."

  # {holding} {exit} {every}
  position_open: "_Position open on **{holding}** until {exit}. Reports every {every}._"

  # {target} {opened_at} {closed_at} {change} {multiplier} {stake} {returned}
  # {profit} {balance} {outcome} {coherence} {was_coherence} {flat} {drained}
  returns: |
    **Returns**
    {holding}: open @ {opened_at}, close @ {closed_at}
    Change {change} · multiplier {multiplier}

    Investment {stake} · return {returned} · **{outcome} {profit}**

    Balance {balance}{#if flat} {/if}

    Your coherence: {coherence} (was {was_coherence}){#if forced}
    _Closed early: EOD._{/if}{#if drained} {/if}

  # {world} {target} {exit}
  take_profit: |
    Coupling to **{holding}**. Where do you take profit?

    You are at {moment}. Choose any point from {first} to {last} — the position closes there and the round ends.

  # {balance}
  ask_stake: "How much do you stake? (1 – {balance})"
  # {last}
  ask_target: "Couple to which holding? (0 – {last})"
  # {first} {last}
  ask_exit: "Pick a point from {first} to {last}."
  ask_units: How many upgrades?

  left: You leave before anything is committed.
  observed_all: You observed the whole circuit and staked nothing. Your qubit is untouched.
  broke: "**You are out of money. The walk ends here.**"
  nothing_to_stake: You have nothing left to stake.
  turn_failed: Something went wrong at this end and your last move was lost. Send anything to pick up where you were.

  # {recharge} {unit_cost} {coherence} {balance} {budget} {bonus} {units}
  # {upgrades} {recovering} {recovery}
  marketplace: |
    **The workshop**
    A spent investment-bit cleans up on its own in {recharge}. Each upgrade buys a quarter again, once, for {unit_cost} out of today's budget.

    Coherence {coherence} · today's balance {balance}
    Upgrades owned {upgrades}{#if recovering}
    Clean again in {recovery}{/if}

  # {bought} {spent} {upgrades} {recovery}
  upgraded: "{bought} bought for {spent}. {upgrades} owned — clean-up now takes {recovery}."
  # {cost} {balance}
  cannot_afford: "An upgrade is {cost} and you have {balance}."

  # {day} {pl} {good} {traded} {idle} {was_budget} {budget} {change} {floored} {floor}
  day_end: |
    **The bell — day {day} closes**

    {#if idle}You made no investments today.{:else}Day's result: {pl}{/if}
    Budget {was_budget} → **{budget}** ({change})
    {#if floored}_Your budget cannot fall below {floor}._{/if}

  # {total} {paid} {bonus} {pot}
  week_end: |
    **The week closes.** Seven days came to {total}.
    {#if paid}A personal bonus of {bonus} has been paid. Your pot stands at {pot}. It cannot be invested.{:else}No bonus this week.{/if}

  # {exit} {remaining} {reachable}
  exit_past_bell: |
    **{exit} falls after the bell.**

    The day ends in {remaining} and every position closes where it stands, so you would be sold out early — {reachable} is the last point you can reach in full.

    Hold anyway, or choose again?

  # {worlds} {skipped} {recharge}
  welcome: |
    **OFFICE 4B, 6 MACKENZIE WALK**

    Welcome to Mackenzie Walk Capital, London's premier neo-market-day-trading firm.

    As a quick refresher, neo-markets are ultra-small markets opened up for investment as one of the early benefits of 2028's discovery of AGI. Initially focused on ecosystems and microclimates, with an as-yet unrealised hope that this could allow hedging against climate collapse, the increasing rate of cyborg-centaur-competition has lead to ever smaller markets being discovered. It’s estimated that market count doubles every 3 days, and this rate of doubling has itself doubled in the last month.

    The current state-of-the art is quantum markets, impossibly small in scale. Here at Mackenzie Walk Capital, we pride ourselves on being the first to enter neo-markets, but you know that from the orientation. Despite what happened with the microclimate markets, we're confident that these are small enough that there shouldn't be any negative externalities, it's just a few electrons or whatever.

    So, boot up your FOOMBERG™ terminal, this is where you find markets. As you're a newbie, it'll give you three to choose from and one possible investment-bit. 
    
    This means you can choose one entity in one market to invest in. Pick wisely. Spend some time observing the trajectories before making your decision, but don't wait too long. If the value of the entity is up when you exit, you make money, if it's down you lose it. Simple as that.
    
    When you invest, your investment-bit is coupled with the entity you choose and you have to wait for your exit point before you can make further calls.

    Remember your investment bit will come back changed and you may need to wait for it to clean up ({recharge}).

  # {elapsed} {gained}
  time_passed: "{elapsed} passed: {gained}"

# One of these is chosen at random when a player writes during their own run.
chatter:
  - The circuit is mid-run. Nothing to decide until it settles.
  - Noted. The gates do not care.
  - Still running. You can only watch from here.
  - The stake is placed. It plays out either way.

prompts:
  # {options}
  unknown: "Type {options}."
  help: |
    **Commands**
    `1` `2` `3` — enter a world · `m` — marketplace
    `i` — invest · `o` — observe on · `l` — leave
    `b` / `s` — buy or sell regeneration · `l` — leave the marketplace
    When asked for a number, just type it.
  say_something: Say something, or type **help**.
  nothing_to_decide: Nothing to decide just now.

buttons:
  invest: Invest
  observe: Observe
  leave: Leave
  marketplace: Marketplace
  status: Status
  buy: Buy
  hold_anyway: Hold anyway
  choose_again: Choose again
  all_stake: "All {amount}"
  stake: "{amount}"
  # {index} {world} {opportunities}
  world: "{index}. {world} — {opportunities} opportunit{opportunities|s:y:ies}"
  # {readout}
  exit_point: "{moment}"
  exit_end: "{moment} (the end)"
  qubit: "{holding}"
  # {world} {until}
  locked_toast: "Your money is committed to {world} until {until}."

# The five bands a world's complexity is described by, easiest first.
# Thresholds live in code; add or rename words here and the bands re-space.
vocabulary:
  # How one holding inside a world is named, and how a moment in its progress
  # is named. {index} counts from zero. Everything that shows either - messages,
  # buttons, and the labels drawn onto the plots - uses these.
  holding: "E{index}"
  moment: "t{index}"

  complexity:
    - simple
    - moderate
    - involved
    - dense
    - labyrinthine

# Plot captions. These are drawn onto an image in a font with no box-drawing
# glyphs or angle brackets, so keep them to plain ASCII.
plots:
  # {world} {gates} {layers}
  gatemap_title: "{world}"
  # from ^ - {gates} gates over {layers} layers
  # {world} {progress}
  traces_title: "{world} - {moment}"
  # {world} {target} {change}
  traces_running: "{world} - {holding} running {change}"
  gatemap_legend: "[] 1-qubit  o-o 2-qubit  : readouts"
  traces_legend: "<value> -1 to +1 per row"

